name: 'Abstractum — зеркало зависимостей'

# Иначе GitHub подписал бы прогон первой строкой сообщения коммита, и печь
# зависимостей называлась бы по правке, которая её задела.
run-name: 'Зеркало зависимостей'

# Собирает conan-зависимости из исходников и кладёт кеш в релиз `deps-cache`
# нашего же репозитория. Сборка потом достаёт его оттуда.
#
# ЗАЧЕМ. Раньше готовые бинарники openssl, libssh, awg-go, tun2socks и прочего
# приезжали с чужого conan-ремоута, который прописывал recipes_bootstrap.cmake
# при каждой конфигурации. Рецепты у нас свои и лежат в recipes/, но рецепт это
# инструкция, а не результат: без замены раннер собирал бы всё заново на каждом
# прогоне.
#
# СОБИРАЕМ САМИ, А НЕ КОПИРУЕМ ЧУЖОЕ. Решение владельца 05.08.2026. Зеркало из
# чужих бинарников было бы быстрее печь, но оставило бы происхождение прежним, а
# наши 19 рецептов - ни разу не проверенными. Здесь они проверяются каждой
# печатью: не собрались - прогон красный, и мы знаем об этом сразу.
#
# ЧТО ЭТО НЕ МЕНЯЕТ. Исходники по-прежнему качаются с github.com, go.dev,
# openssl.org и wintun.net - так написаны рецепты. Уровень вендоринга первый.
#
# ЗАПУСКАЕТСЯ САМ, когда меняется то, из чего считается ключ - см. `paths` ниже и
# список в .github/deps-key.sh. Руками нужно только если поменялась логика самой
# печати: содержимое зависимостей от этого не зависит, ключ не меняется.
#
#   gh workflow run abstractum-deps.yml -R FFriends/AbstractumVPN
#
# ПОВТОРНО НЕ ПЕРЕПЕКАЕТ. Если оба архива под текущий ключ уже лежат в релизе,
# джоб `Key` гасит сборку. Перепечь принудительно - `force` у ручного запуска.
#
# ТЕГ ОДИН И ТОТ ЖЕ, ассеты в нём перезаписываются. Причина не в аккуратности:
# UpdateController запрашивает releases?per_page=10 и ищет обновление среди
# последних десяти. Плодить релизы `deps-*` значит вытеснять оттуда настоящие.
# Один фиксированный тег занимает ровно одну позицию навсегда. Сам он за
# обновление принят не будет - normalizedVersion обрезает тег по дефису и
# получает `deps`, QVersionNumber такое не разбирает.

on:
  push:
    branches:
      - dev
    paths:
      - 'recipes/**'
      - 'conanfile.py'
      - 'cmake/conan_provider.cmake'
      - 'cmake/platform_settings.cmake'
      - 'cmake/recipes_bootstrap.cmake'
  workflow_dispatch:
    inputs:
      force:
        description: 'Перепечь, даже если архивы под этот ключ уже есть'
        type: boolean
        default: false

# Читать хватает всем, кроме публикации: ей право записи выдано точечно.
permissions:
  contents: read

concurrency:
  group: deps-mirror
  cancel-in-progress: false

env:
  CONAN_VERSION: 2.28.0
  PYTHON_VERSION: '3.14'
  DEPS_TAG: deps-cache

jobs:
  Key:
    name: 'Ключ зеркала и нужно ли пересобирать'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      key: ${{ steps.key.outputs.key }}
      should_bake: ${{ steps.key.outputs.should_bake }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: 'Решение'
        id: key
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        shell: bash
        run: |
          set -euo pipefail

          key=$(.github/deps-key.sh "${CONAN_VERSION}")
          echo "key=${key}" >> "$GITHUB_OUTPUT"
          echo "Ключ зеркала: ${key}"

          if [ "${FORCE}" = "true" ]; then
            echo "should_bake=true" >> "$GITHUB_OUTPUT"
            echo "Запрошена принудительная перепечка."
            exit 0
          fi

          # Отсутствие релиза - не ошибка: первый прогон его и создаст.
          have=$(gh release view "$DEPS_TAG" --json assets --jq '.assets[].name' 2>/dev/null || true)

          missing=0
          for os in linux windows; do
            name="conan-cache-${os}-${key}.tgz"
            if printf '%s\n' "$have" | grep -qxF "$name"; then
              echo "Уже в зеркале: $name"
            else
              echo "Нет в зеркале: $name"
              missing=1
            fi
          done

          if [ "$missing" -eq 0 ]; then
            echo "should_bake=false" >> "$GITHUB_OUTPUT"
            echo "Зеркало актуально, печь нечего."
          else
            echo "should_bake=true" >> "$GITHUB_OUTPUT"
          fi

  # Раннеры обязаны совпадать с теми, где идёт настоящая сборка: версия
  # компилятора входит в package_id. Разъедутся - кеш будет печься впустую и
  # никогда не попадать, причём молча (гоча CI-14).
  Bake-Linux:
    name: 'Сборка зависимостей: Linux'
    needs: Key
    if: needs.Key.outputs.should_bake == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - run: pip install "conan==${{ env.CONAN_VERSION }}"

      # PREBUILTS_ONLY - крючок в CMakeLists.txt: конфигурация доходит до
      # find_package(OpenSSL), которым запускается conan install на весь
      # conanfile.py, и выходит до сборки приложения. Поэтому Qt здесь не нужен.
      #
      # CMAKE_BUILD_TYPE=Release задан явно: build_type входит в package_id, а
      # настоящие сборки идут только в Release.
      - name: 'Собрать зависимости'
        shell: bash
        run: cmake -S . -B build -DPREBUILTS_ONLY=1 -DCMAKE_BUILD_TYPE=Release

      - name: 'Упаковать кеш'
        shell: bash
        run: |
          set -euo pipefail
          conan cache save "*:*" --no-source --file "conan-cache-linux-${{ needs.Key.outputs.key }}.tgz"
          ls -lh conan-cache-linux-*.tgz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deps-linux
          if-no-files-found: error
          retention-days: 1
          path: conan-cache-linux-*.tgz

  Bake-Windows:
    name: 'Сборка зависимостей: Windows'
    needs: Key
    if: needs.Key.outputs.should_bake == 'true'
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - run: pip install "conan==${{ env.CONAN_VERSION }}"

      # Окружение MSVC поднимается тем же способом, что и в deploy/build.bat:
      # vswhere находит установку, vcvarsall её включает. Стороннее действие для
      # этого не берём - лишняя зависимость ради двух строк.
      #
      # Путь к vswhere сперва кладётся в переменную, и это не косметика: cmd
      # разбирает блок `in (...)` по парности скобок, а в %ProgramFiles(x86)%
      # скобки есть, и разбор ломается прямо на них.
      - name: 'Собрать зависимости'
        shell: cmd
        run: |
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          if not exist "%VSWHERE%" (echo ERROR: vswhere not found & exit /b 1)
          for /f "usebackq tokens=*" %%I in (`"%VSWHERE%" -products * -latest -property resolvedInstallationPath`) do call "%%I\VC\Auxiliary\Build\vcvarsall.bat" amd64
          if errorlevel 1 exit /b 1
          cmake -S . -B build -DPREBUILTS_ONLY=1 -DCMAKE_BUILD_TYPE=Release || exit /b 1

      - name: 'Упаковать кеш'
        shell: bash
        run: |
          set -euo pipefail
          conan cache save "*:*" --no-source --file "conan-cache-windows-${{ needs.Key.outputs.key }}.tgz"
          ls -lh conan-cache-windows-*.tgz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deps-windows
          if-no-files-found: error
          retention-days: 1
          path: conan-cache-windows-*.tgz

  Publish:
    name: 'Публикация зеркала'
    needs: [Key, Bake-Linux, Bake-Windows]
    if: needs.Key.outputs.should_bake == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Единственный джоб, которому нужна запись.
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: mirror
          merge-multiple: true

      # Лимит ассета GitHub - 2 ГБ. Упереться в него на выгрузке значит потерять
      # весь прогон, поэтому проверяем заранее и говорим прямо.
      - name: 'Проверить размер'
        shell: bash
        run: |
          set -euo pipefail
          ls -lhR mirror

          shopt -s nullglob
          files=(mirror/*.tgz)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::Архивов нет - печь было нечего или артефакты не доехали."
            exit 1
          fi

          limit=$((2 * 1024 * 1024 * 1024))
          fail=0
          for f in "${files[@]}"; do
            size=$(stat -c%s "$f")
            echo "$f - $size байт"
            if [ "$size" -ge "$limit" ]; then
              echo "::error::$f не влезает в лимит ассета GitHub (2 ГБ)."
              fail=1
            fi
          done
          [ "$fail" -eq 0 ]

      - name: 'Выложить в релиз'
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ needs.Key.outputs.key }}
        shell: bash
        run: |
          set -euo pipefail

          if ! gh release view "$DEPS_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$DEPS_TAG" -R "$GITHUB_REPOSITORY" \
              --prerelease \
              --title 'Зеркало conan-зависимостей' \
              --notes 'Служебный релиз. Не сборка продукта и не обновление: здесь лежит кеш conan, из которого сборка берёт готовые зависимости. Имя ассета содержит ключ содержимого recipes/.'
          fi

          gh release upload "$DEPS_TAG" -R "$GITHUB_REPOSITORY" mirror/*.tgz --clobber

          echo "Зеркало обновлено, ключ ${KEY}."

  Skipped:
    name: 'Зеркало актуально — пересборка пропущена'
    needs: Key
    if: needs.Key.outputs.should_bake == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - shell: bash
        run: echo "Архивы под ключ ${{ needs.Key.outputs.key }} уже в релизе ${DEPS_TAG}."
